schema_version: 1

context:
  name: pyiron_continuum
  version: "0.0.9"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyiron_continuum-${{ version }}.tar.gz
  sha256: f6d4cf778e177ce1c062ef5c1e0050cb3f5ce6d2c5f33257f3f27a1cbd5284a0

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - matplotlib-base >=3.8.3
    - numpy >=1.26.4
    - pyiron_base >=0.7.11,<0.9
    - scipy >=1.12.0
    - sympy >=1.12
    - python-blosc2  # required by table

tests:
  - python:
      imports:
        - pyiron_continuum
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Repository for user-generated plugins to the pyiron IDE.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/pyiron/pyiron_continuum

extra:
  recipe-maintainers:
    - pyiron-runner
    - jan-janssen
    - pmrv
    - srmnitc
    - niklassiemer
